<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillHub - sliec</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f4f6f9; --card: #ffffff; --text: #475569; --dim: #94a3b8;
      --heading: #0f172a; --accent: #3b82f6; --accent-soft: #eff6ff;
      --green: #10b981; --green-soft: #ecfdf5;
      --orange: #f59e0b; --orange-soft: #fffbeb;
      --purple: #8b5cf6; --purple-soft: #f5f3ff;
      --rose: #f43f5e; --rose-soft: #fff1f2;
      --cyan: #06b6d4; --cyan-soft: #ecfeff;
      --border: #e2e8f0; --radius: 14px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
    }
    html { height: 100%; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: #2563eb; }

    nav {
      height: 50px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; background: var(--card); border-bottom: 1px solid var(--border); flex-shrink: 0;
      position: sticky; top: 0; z-index: 100;
    }
    .brand { font-size: 17px; font-weight: 800; color: var(--heading); }
    .nav-links { display: flex; gap: 6px; align-items: center; }
    .nav-links a { font-size: 13px; color: var(--dim); font-weight: 500; padding: 4px 8px; border-radius: 6px; transition: all .15s; }
    .nav-links a:hover { color: var(--accent); background: var(--accent-soft); }
    .nav-links a.active { color: var(--accent); background: var(--accent-soft); }
    .nav-sep { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; margin: 0 4px; }

    .wrap { max-width: 1200px; margin: 0 auto; width: 100%; padding: 0 28px; flex: 1; }

    .page-hero { padding: 24px 0 0; }
    .page-hero h1 { font-size: 22px; font-weight: 800; color: var(--heading); }
    .page-hero p { font-size: 13px; color: var(--dim); margin-top: 4px; }
    .hero-stats { display: flex; gap: 16px; margin-top: 8px; }
    .hero-stats span { font-size: 12px; color: var(--dim); }
    .hero-stats strong { color: var(--heading); font-size: 16px; }

    .search-wrap { margin: 16px 0 0; }
    .search-box {
      display: flex; align-items: center; gap: 10px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 16px; box-shadow: var(--shadow); transition: border-color .2s;
    }
    .search-box:focus-within { border-color: var(--accent); }
    .search-box svg { flex-shrink: 0; color: var(--dim); }
    .search-box input { flex: 1; border: none; outline: none; font-size: 14px; font-family: var(--font); color: var(--heading); background: transparent; }
    .search-box input::placeholder { color: #cbd5e1; }
    .search-count { font-size: 12px; color: var(--dim); white-space: nowrap; }

    .tab-bar { display: flex; gap: 0; margin: 16px 0 0; border-bottom: 2px solid var(--border); }
    .tab-btn {
      font-size: 13px; font-weight: 600; padding: 8px 20px; cursor: pointer;
      color: var(--dim); border-bottom: 2px solid transparent; margin-bottom: -2px;
      transition: all .15s; user-select: none;
    }
    .tab-btn:hover { color: var(--heading); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-btn .tab-count { font-size: 11px; color: var(--dim); margin-left: 4px; font-weight: 500; }

    .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
    .filter-tag {
      font-size: 11.5px; font-weight: 600; padding: 4px 12px; border-radius: 14px;
      cursor: pointer; border: 1px solid var(--border); background: var(--card);
      color: var(--dim); transition: all .15s; user-select: none;
    }
    .filter-tag:hover { border-color: var(--accent); color: var(--accent); }
    .filter-tag.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .section-head {
      display: flex; align-items: center; gap: 8px; margin: 20px 0 10px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .section-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .section-head h2 { font-size: 15px; font-weight: 700; color: var(--heading); }
    .section-head .count { font-size: 11px; color: var(--dim); background: var(--bg); padding: 2px 8px; border-radius: 10px; }

    table.skill-table {
      width: 100%; border-collapse: collapse; background: var(--card);
      border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
      box-shadow: var(--shadow); margin-bottom: 16px;
    }
    table.skill-table thead th {
      font-size: 11px; font-weight: 700; color: var(--dim); text-transform: uppercase;
      letter-spacing: 0.3px; padding: 10px 14px; text-align: left;
      background: var(--bg); border-bottom: 1px solid var(--border);
    }
    table.skill-table tbody tr { transition: background .1s; }
    table.skill-table tbody tr:hover { background: #fafbfd; }
    table.skill-table tbody td { padding: 10px 14px; border-bottom: 1px solid #f8fafc; font-size: 13px; vertical-align: top; }
    table.skill-table tbody tr:last-child td { border-bottom: none; }
    .s-name { font-weight: 600; color: var(--heading); white-space: nowrap; }
    .s-name a { color: var(--heading); }
    .s-name a:hover { color: var(--accent); }
    .s-desc { color: var(--text); line-height: 1.5; }
    .s-ver { font-size: 11px; color: var(--dim); white-space: nowrap; }

    table.prompt-table {
      width: 100%; border-collapse: collapse; background: var(--card);
      border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
      box-shadow: var(--shadow); margin-bottom: 16px;
    }
    table.prompt-table thead th {
      font-size: 11px; font-weight: 700; color: var(--dim); text-transform: uppercase;
      letter-spacing: 0.3px; padding: 10px 14px; text-align: left;
      background: var(--bg); border-bottom: 1px solid var(--border);
    }
    table.prompt-table tbody tr { transition: background .1s; cursor: pointer; }
    table.prompt-table tbody tr:hover { background: #fafbfd; }
    table.prompt-table tbody td { padding: 10px 14px; border-bottom: 1px solid #f8fafc; font-size: 13px; vertical-align: top; }
    table.prompt-table tbody tr:last-child td { border-bottom: none; }
    .p-name { font-weight: 600; color: var(--heading); }
    .p-cat { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--purple-soft); color: var(--purple); }
    .p-copy {
      font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 8px;
      cursor: pointer; border: 1px solid var(--border); background: var(--card);
      color: var(--dim); transition: all .15s; white-space: nowrap;
    }
    .p-copy:hover { border-color: var(--accent); color: var(--accent); }
    .p-copy.copied { background: var(--green-soft); color: var(--green); border-color: var(--green); }

    .empty-state { text-align: center; padding: 40px 0; color: var(--dim); font-size: 14px; }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3); z-index: 200; align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--card); border-radius: 16px; padding: 24px 28px;
      max-width: 640px; width: 90%; max-height: 80vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .modal h3 { font-size: 16px; font-weight: 700; color: var(--heading); margin-bottom: 4px; }
    .modal .m-desc { font-size: 12.5px; color: var(--dim); margin-bottom: 14px; }
    .modal .m-text {
      background: var(--bg); border-radius: 10px; padding: 14px 16px;
      font-size: 13px; line-height: 1.65; color: var(--text);
      white-space: pre-wrap; word-break: break-word; border: 1px solid #f1f5f9;
    }
    .modal .m-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .modal .m-btn {
      font-size: 12px; font-weight: 600; padding: 7px 18px; border-radius: 10px;
      cursor: pointer; border: 1px solid var(--border); background: var(--card);
      color: var(--dim); transition: all .15s;
    }
    .modal .m-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .modal .m-btn.primary:hover { background: #2563eb; }
    .modal .m-btn:hover { border-color: var(--accent); color: var(--accent); }

    .footer {
      height: 30px; display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #cbd5e1; flex-shrink: 0; margin-top: 16px;
    }

    @media (max-width: 768px) {
      .wrap { padding: 0 16px; }
      table.skill-table thead th, table.skill-table tbody td,
      table.prompt-table thead th, table.prompt-table tbody td { padding: 8px 10px; }
      .s-desc { font-size: 12px; }
    }
  </style>
</head>

{title:"代码审查助手",cat:"编程开发",desc:"系统性审查代码质量，发现潜在问题和优化点",prompt:"请审查以下代码，按优先级从高到低列出问题：\n\n审查维度：\n- 安全性：SQL注入、XSS、敏感信息泄露\n- 性能：N+1查询、内存泄漏、不必要的计算\n- 可维护性：命名规范、函数职责、代码复用\n- 错误处理：边界条件、异常捕获、降级策略\n\n对每个问题，给出：问题描述 + 影响 + 修改建议（含代码示例）"},

{title:"会议纪要整理",cat:"办公效率",desc:"将会议内容整理为结构化纪要",prompt:"请将以下会议内容整理为结构化纪要：\n\n输出格式：\n1. 会议主题与时间\n2. 参会人员\n3. 核心议题与讨论要点\n4. 关键决议（明确结论）\n5. 待办事项（负责人 + 截止时间）\n6. 下次会议安排\n\n要求：提炼核心信息、去除闲聊和重复、重点标注有分歧或需跟进的事项"},
{title:"周报/日报生成",cat:"办公效率",desc:"从碎片化工作记录中生成结构化周报",prompt:"请将以下工作记录整理为周报：\n\n## 本周完成\n- [项目名] 具体成果（量化数据优先）\n\n## 进行中\n- [项目名] 当前进度 + 预计完成时间\n\n## 下周计划\n- 优先级排序，标注预计产出\n\n## 风险与协调\n- 需要支持的事项、潜在阻塞点\n\n要求：成果导向、数据量化、简洁有力。"},

const SKILL_CATS=[
{key:"金融投资",dot:"var(--orange)"},
{key:"产品管理",dot:"var(--accent)"},
{key:"思维方法",dot:"var(--purple)"},
{key:"文档生成",dot:"var(--green)"},
{key:"开发运维",dot:"var(--cyan)"},
{key:"系统工具",dot:"#64748b"},
{key:"外部集成",dot:"var(--rose)"},
{key:"飞书生态",dot:"#16a34a"},
];
const PROMPT_CATS=[...new Set(PROMPTS.map(p=>p.cat))];
const REPO="https://github.com/sliec/shared-files/tree/main/skills/";

let curTab="skills",sFilter="all",pFilter="all",search="",modalIdx=-1;

function init(){
  const sf=document.getElementById("skillFilter");
  sf.innerHTML=`<span class="filter-tag active" data-cat="all" onclick="setSF('all')">全部 <span style="font-size:10px;color:var(--dim)">${SKILLS.length}</span></span>`+
    SKILL_CATS.map(c=>{const n=SKILLS.filter(s=>s.cat===c.key).length;return`<span class="filter-tag" data-cat="${c.key}" onclick="setSF('${c.key}')">${c.key} <span style="font-size:10px;color:var(--dim)">${n}</span></span>`}).join("");
  const pf=document.getElementById("promptFilter");
  pf.innerHTML=`<span class="filter-tag active" data-cat="all" onclick="setPF('all')">全部 <span style="font-size:10px;color:var(--dim)">${PROMPTS.length}</span></span>`+
    PROMPT_CATS.map(c=>{const n=PROMPTS.filter(p=>p.cat===c).length;return`<span class="filter-tag" data-cat="${c}" onclick="setPF('${c}')">${c} <span style="font-size:10px;color:var(--dim)">${n}</span></span>`}).join("");
  document.getElementById("searchInput").addEventListener("input",e=>{search=e.target.value.toLowerCase().trim();render()});
  render();
}

function switchTab(t){curTab=t;document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));document.getElementById("skillsSection").style.display=t==="skills"?"":"none";document.getElementById("promptsSection").style.display=t==="prompts"?"":"none";render()}
function setSF(c){sFilter=c;document.querySelectorAll("#skillFilter .filter-tag").forEach(t=>t.classList.toggle("active",t.dataset.cat===c));render()}
function setPF(c){pFilter=c;document.querySelectorAll("#promptFilter .filter-tag").forEach(t=>t.classList.toggle("active",t.dataset.cat===c));render()}

function render(){curTab==="skills"?renderS():renderP()}

function renderS(){
  const f=SKILLS.filter(s=>{const mc=sFilter==="all"||s.cat===sFilter;const ms=!search||s.name.toLowerCase().includes(search)||s.desc.toLowerCase().includes(search)||s.cat.toLowerCase().includes(search);return mc&&ms});
  document.getElementById("searchCount").textContent=f.length+" / "+SKILLS.length;
  document.getElementById("skillCount").textContent=f.length;
  const c=document.getElementById("skillContent");
  if(!f.length){c.innerHTML='<div class="empty-state">没有匹配的 Skills</div>';return}
  const g={};SKILL_CATS.forEach(x=>g[x.key]=[]);f.forEach(s=>{if(g[s.cat])g[s.cat].push(s)});
  c.innerHTML=SKILL_CATS.map(x=>{const items=g[x.key];if(!items||!items.length)return"";return`
    <div class="section-head"><div class="section-dot" style="background:${x.dot}"></div><h2>${x.key}</h2><span class="count">${items.length}</span></div>
    <table class="skill-table"><thead><tr><th style="width:200px">名称</th><th>描述</th><th style="width:60px">版本</th></tr></thead>
    <tbody>${items.map(s=>`<tr><td class="s-name"><a href="${REPO}${s.name}" target="_blank">${esc(s.name)}</a></td><td class="s-desc">${esc(s.desc)}</td><td class="s-ver">${s.ver||'—'}</td></tr>`).join("")}</tbody></table>`}).join("");
}

function renderP(){
  const f=PROMPTS.filter(p=>{const mc=pFilter==="all"||p.cat===pFilter;const ms=!search||p.title.toLowerCase().includes(search)||p.desc.toLowerCase().includes(search)||p.cat.includes(search)||p.prompt.toLowerCase().includes(search);return mc&&ms});
  document.getElementById("searchCount").textContent=f.length+" / "+PROMPTS.length;
  document.getElementById("promptCount").textContent=f.length;
  const c=document.getElementById("promptContent");
  if(!f.length){c.innerHTML='<div class="empty-state">没有匹配的提示词</div>';return}
  c.innerHTML=`<table class="prompt-table"><thead><tr><th style="width:180px">名称</th><th>描述</th><th style="width:90px">分类</th><th style="width:60px">操作</th></tr></thead>
    <tbody>${f.map(p=>{const ri=PROMPTS.indexOf(p);return`<tr onclick="showModal(${ri})"><td class="p-name">${esc(p.title)}</td><td class="s-desc">${esc(p.desc)}</td><td><span class="p-cat">${esc(p.cat)}</span></td><td><button class="p-copy" onclick="event.stopPropagation();copyP(${ri},this)">复制</button></td></tr>`}).join("")}</tbody></table>`;
}

function showModal(i){modalIdx=i;const p=PROMPTS[i];document.getElementById("modalTitle").textContent=p.title;document.getElementById("modalDesc").textContent=p.desc;document.getElementById("modalText").textContent=p.prompt;document.getElementById("modalCopy").textContent="复制";document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show");modalIdx=-1}
function copyModalPrompt(){if(modalIdx<0)return;navigator.clipboard.writeText(PROMPTS[modalIdx].prompt).then(()=>{const b=document.getElementById("modalCopy");b.textContent="已复制";setTimeout(()=>b.textContent="复制",1500)})}
function copyP(i,btn){navigator.clipboard.writeText(PROMPTS[i].prompt).then(()=>{btn.textContent="已复制";btn.classList.add("copied");setTimeout(()=>{btn.textContent="复制";btn.classList.remove("copied")},1500)})}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

init();
</script>

</body>
</html>
